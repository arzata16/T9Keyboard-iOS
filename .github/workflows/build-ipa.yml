name: Build iOS T9 Keyboard IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build App & Extension
      run: |
        xcodebuild clean build \
          -project T9Keyboard.xcodeproj \
          -scheme T9Keyboard \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          BUILD_DIR=build

    - name: Package Unsigned IPA
      run: |
        mkdir -p Payload
        cp -R build/Release-iphoneos/T9Keyboard.app Payload/
        zip -r T9Keyboard.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: T9Keyboard-iPhone14Plus-IPA
        path: T9Keyboard.ipa
