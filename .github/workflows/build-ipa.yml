name: Build iOS T9 Keyboard IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Menggunakan macos-13 (Standard Intel runner yang tersedia gratis di semua akun GitHub)
    runs-on: macos-13

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify Xcode Version
      run: |
        xcodebuild -version

    - name: Build App & Extension (Unsigned)
      run: |
        xcodebuild clean build \
          -project T9Keyboard.xcodeproj \
          -scheme T9Keyboard \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package Unsigned IPA
      run: |
        mkdir -p Payload
        cp -R build/Release-iphoneos/T9Keyboard.app Payload/
        zip -r T9Keyboard.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: T9Keyboard-iPhone14Plus-IPA
        path: T9Keyboard.ipa
        retention-days: 7
